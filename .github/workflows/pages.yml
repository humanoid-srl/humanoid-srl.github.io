name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Download original-quality videos
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          readarray -t media < <(python -c 'import json; m=json.load(open("media-manifest.json")); print(m["release_tag"]); print(m["asset"])')
          mkdir -p "$RUNNER_TEMP/humanoid-srl-media"
          gh release download "${media[0]}" --pattern "${media[1]}" --dir "$RUNNER_TEMP/humanoid-srl-media"
          python tools/restore_media.py "$RUNNER_TEMP/humanoid-srl-media/${media[1]}"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
